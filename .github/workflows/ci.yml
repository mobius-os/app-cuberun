name: CI

# CubeRun ships a checked-in Vite bundle wrapped by a Möbius mini-app
# (index.jsx). CI proves that the source recreates that exact package, then
# compile-smokes the wrapper the way the Möbius compiler does.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build the game
        run: npm run verify

      - name: Recreate the Möbius package
        run: npm run package:mobius

      - name: Verify mobius package (static_assets manifest)
        run: npm run verify:mobius

      - name: Verify checked-in package is current
        run: git diff --exit-code HEAD -- build mobius.json

      - name: Compile-smoke the Möbius wrapper (index.jsx)
        run: npx --yes rolldown@1.2.2 -c rolldown.config.mjs
